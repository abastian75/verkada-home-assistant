<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verkada synthetic UI fixture</title><style>body{margin:0;font-family:Roboto,Arial,sans-serif}#fixture-note{padding:8px 24px;background:#fff4d6;color:#302500;font-size:14px}verkada-panel{height:calc(100vh - 32px)}</style></head><body><div id="fixture-note">Synthetic test fixture — no real cameras, plates or credentials</div><verkada-panel></verkada-panel><script type="module">
import '../custom_components/verkada/frontend/verkada-panel.js';
const now=Math.floor(Date.now()/1000)-60;
const cameras=[{camera_id:'camera-one',entity_id:'camera.synthetic_driveway',name:'Driveway',status:'Live',site:'Synthetic home'},{camera_id:'camera-two',entity_id:'camera.synthetic_gate',name:'Gate',status:'Offline',site:'Synthetic home'}];
const picture='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><rect width="640" height="360" fill="#263b42"/><path d="M180 360 285 140h70l105 220" fill="#829299"/><path d="M0 160 120 80l100 80v140H0" fill="#506b57"/><text x="320" y="55" fill="white" text-anchor="middle" font-family="sans-serif" font-size="22">Synthetic camera thumbnail</text></svg>');
const data={title:'Verkada',connected:true,last_poll:now,sources:{alerts:{state:'ok',last_success:now},'lpr:camera-one':{state:'ok',last_success:now}},last_webhook:null,webhook_enabled:false,webhook_url:'/api/webhook/synthetic-test-id',external_url_configured:false,lpr_camera_ids:['camera-one'],helix_enabled:true,history_days:7,cameras,events:[{id:'1',source:'lpr',kind:'lpr',camera_id:'camera-one',timestamp:now-30,plate:'TEST123',label:'lpr',confidence:.98,attributes:{}},{id:'2',source:'alert',kind:'motion',camera_id:'camera-one',timestamp:now-60,plate:null,label:'Person in driveway',attributes:{}},{id:'3',source:'helix',kind:'helix',camera_id:'camera-two',timestamp:now-90,plate:'DEMO456',label:'Vehicle arrival',attributes:{make:'Synthetic',color:'Blue'}},{id:'4',source:'alert',kind:'tamper',camera_id:'camera-one',timestamp:now-120,plate:null,label:'<img src=x onerror="window.bad=true">',attributes:{}}]};
window.fixtureCalls=[];
const videoURL=new URL(location.href).searchParams.get('video');
const panel=document.querySelector('verkada-panel');
panel.hass={states:Object.fromEntries(cameras.map(c=>[c.entity_id,{state:c.status==='Live'?'idle':'unavailable',attributes:{entity_picture:picture,...(c.camera_id==='camera-one'?{plate_tracking:true,last_plate:'TEST123',plate_last_seen:now-30}:{})}}])),hassUrl:url=>url,callWS:async msg=>{window.fixtureCalls.push(msg);if(msg.action==='playback'||msg.type==='camera/stream'){if(videoURL)return {url:videoURL};throw new Error('Synthetic fixture: real video is tested separately in the HA runtime.');}if(msg.action==='search')return {...data,search_results:data.events,search_omitted:0};return data;}};
panel.panel={config:{entry_id:'synthetic-entry'}};
</script></body></html>
