<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verkada cards — synthetic fixture</title><style>
body{margin:0;background:var(--primary-background-color,#fafafa);color:var(--primary-text-color,#212121);font:16px Roboto,Arial,sans-serif}header{padding:20px 24px}header h1{font-size:24px;font-weight:500;margin:0 0 8px}header p{margin:0 0 12px;font-size:14px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding:0 24px 24px}.editor{margin:0 24px 24px;max-width:480px}button{min-height:44px;padding:8px 14px;border:1px solid #888;border-radius:8px;background:var(--card-background-color,#fff);color:inherit;font:inherit;cursor:pointer}body.dark{--primary-background-color:#111;--card-background-color:#1c1c1c;--primary-text-color:#eee;--secondary-text-color:#bbb;--divider-color:#555;--secondary-background-color:#292929;--primary-color:#4db6ff;--error-color:#ff8b83;color-scheme:dark}@media(max-width:850px){.grid{grid-template-columns:1fr}}
</style></head><body><header><h1>Verkada dashboard cards</h1><p>Synthetic test fixture — invented cameras and plates. No real credentials.</p><button id="edit">Edit LPR card</button> <button id="theme">Dark theme</button></header><main class="grid"><verkada-camera-card></verkada-camera-card><verkada-events-card></verkada-events-card><verkada-lpr-card></verkada-lpr-card></main><section class="editor" aria-label="Card editor"></section><script type="module">
import '../custom_components/verkada/frontend/verkada-cards.js';
import {createHass} from './fixtures.js';
const hass=createHass();
const configs=[{type:'custom:verkada-camera-card',entity:'camera.synthetic_driveway'},{type:'custom:verkada-events-card',entry_id:'synthetic-entry',rows:5},{type:'custom:verkada-lpr-card',entry_id:'synthetic-entry',camera_id:'camera-one',rows:5}];
document.querySelectorAll('main>*').forEach((card,index)=>{card.setConfig(configs[index]);card.hass=hass;});
document.querySelector('#edit').onclick=()=>{const editor=document.createElement('verkada-card-editor');editor.setConfig(configs[2]);editor.hass=hass;editor.addEventListener('config-changed',event=>{configs[2]=event.detail.config;document.querySelector('verkada-lpr-card').setConfig(configs[2]);});document.querySelector('.editor').replaceChildren(editor);};
document.querySelector('#theme').onclick=()=>document.body.classList.toggle('dark');
</script></body></html>
